name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (TidyCore)
        run: swift test --package-path TidyCore

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build app (unsigned)
        run: >
          xcodebuild -project Tidy.xcodeproj -scheme Tidy -configuration Release
          -sdk iphoneos -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tidy.app Payload/
          zip -qry Tidy.ipa Payload

      - name: Verify IPA layout
        run: |
          unzip -l Tidy.ipa | grep -q 'Payload/Tidy.app/Info.plist'
          unzip -l Tidy.ipa | grep -q 'Payload/Tidy.app/Tidy$'
          unzip -l Tidy.ipa | grep -q 'Payload/Tidy.app/AppIcon60x60@2x.png'

      - uses: actions/upload-artifact@v4
        with:
          name: Tidy-ipa
          path: Tidy.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tidy.ipa
